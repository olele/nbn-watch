name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra desktop
      - if: runner.os == 'Linux'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy nbn_watch
      - run: uv run pytest tests/ -q
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
