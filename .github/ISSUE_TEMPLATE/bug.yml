name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: NBN Watch version and OS, placeholder: "0.3.0 on Windows 11" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
