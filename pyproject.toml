[project]
name = "nbn-watch"
version = "0.3.0"
description = "Know the moment your NBN drops: router-level outage detection, 4G-backup tracking, Telegram alerts and a community outage map."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "niquests>=3.18.2",
]

[project.optional-dependencies]
desktop = [
    "pillow>=11.0.0",
    "pystray>=0.19.5",
]

[project.scripts]
nbn-watch = "nbn_watch.desktop.app:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pillow>=11.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"nbn_watch/desktop/ui.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=nbn_watch --cov-report=term-missing --cov-fail-under=85"
